
<html>
  <head>
    <script
      async=""
      src="https://www.googletagmanager.com/gtag/js?id=G-L7856P3VNT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-L7856P3VNT");
    </script>

    <base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/tunnel-rush/" />
    <link rel="stylesheet" href="style/style.css" />
    <script src="UnityLoader.js"></script>
    <script src="UnityProgress.js"></script>
    <link rel="icon" href="img/tunnel.jpg" />

    <style>
      * {
        cursor: none !important;
      }

      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition: width 0.15s ease, height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }

      @media (hover: none) {
        #custom-cursor,
        #cursor-circle {
          display: none;
        }

        * {
          cursor: auto !important;
        }
      }
    </style>

    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "build.json",
        {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, "complete");
            },
          },
        },
      );
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div
        id="gameContainer"
        style="width: 100%; height: 95%; margin: auto"
      ></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Tunnel Rush</div>
      </div>
    </div>

    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

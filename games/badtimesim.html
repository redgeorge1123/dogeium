
<!DOCTYPE html>
<html>
  <head>
    <script>
      const cancelFrame = window.cancelAnimationFrame.bind(window);
      window.cancelAnimationFrame = function (value) {
        return typeof value === "function"
          ? window.requestAnimationFrame(value)
          : cancelFrame(value);
      };
    </script>

    <base
      href="https://cdn.jsdelivr.net/gh/bobydob/JSEngine@4c04e7fb85008b3d23ba8848826ba2c0a859fa4f/build/bts-sans/"
    />

    <style type="text/css">
      * {
        padding: 0;
        margin: 0;
        cursor: none !important;
      }

      html,
      body {
        background: #000;
        color: #fff;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
      }

      canvas {
        touch-action-delay: none;
        touch-action: none;
        -ms-touch-action: none;
      }

      /* Custom yellow cursor */
      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition:
          width 0.15s ease,
          height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }
    </style>

    <script src="offlineClient.js"></script>

    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(100px);
        }
        90% {
          transform: translateX(100px);
        }
        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="fb-root"></div>

    <script>
      (function () {
        if (window.location.protocol.substr(0, 4) === "file") {
          alert(
            "Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)",
          );
        }
      })();
    </script>

    <div
      id="c2canvasdiv"
      style="width: 640px; height: 480px; margin-left: 342px; margin-top: 202px"
    >
      <canvas
        id="c2canvas"
        width="640"
        height="480"
        style="width: 640px; height: 480px"
      >
        <h1>
          Your browser does not appear to support HTML5. Try upgrading your
          browser to the latest version.
          <a href="http://www.whatbrowser.org">What is a browser?</a>
          <br />
          <br />
          <a
            href="http://www.microsoft.com/windows/internet-explorer/default.aspx"
          >
            Microsoft Internet Explorer
          </a>
          <br />
          <a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a>
          <br />
          <a href="http://www.google.com/chrome/">Google Chrome</a>
          <br />
          <a href="http://www.apple.com/safari/download/">Apple Safari</a>
        </h1>
      </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/nbjrkzddz/5yrgdegfwfew4@d3772e576f5a2ad716d32ace9c7e5b94f59ded9e/bigfoot/g/gfiles/gfiles/html5/sans-fight/jquery-3.4.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/bobydob/JSEngine@4c04e7fb85008b3d23ba8848826ba2c0a859fa4f/build/bts-sans/c2.js"></script>

    <script>
      jQuery(document).ready(function () {
        cr_createRuntime("c2canvas");
      });

      function onVisibilityChanged() {
        if (
          document.hidden ||
          document.mozHidden ||
          document.webkitHidden ||
          document.msHidden
        )
          cr_setSuspended(true);
        else cr_setSuspended(false);
      }

      document.addEventListener("visibilitychange", onVisibilityChanged, false);
      document.addEventListener(
        "mozvisibilitychange",
        onVisibilityChanged,
        false,
      );
      document.addEventListener(
        "webkitvisibilitychange",
        onVisibilityChanged,
        false,
      );
      document.addEventListener(
        "msvisibilitychange",
        onVisibilityChanged,
        false,
      );

      function OnRegisterSWError(e) {
        console.warn("Failed to register service worker: ", e);
      }

      window.C2_RegisterSW = function C2_RegisterSW() {
        if (!navigator.serviceWorker) return;
        try {
          navigator.serviceWorker
            .register("sw.js", {
              scope: "./",
            })
            .then(function (reg) {
              console.log("Registered service worker on " + reg.scope);
            })
            .catch(OnRegisterSWError);
        } catch (e) {
          OnRegisterSWError(e);
        }
      };
    </script>

    <!-- Custom cursor elements -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <!-- Custom cursor script -->
    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

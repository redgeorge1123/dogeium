    <script nonce="nEsvHewDKSKQZPWExNde-A">
      async function prepareGame() {
        window.fast.gameAudio = ytgame.system.isAudioEnabled();
        await ytgame.system.getLanguage().then(function (lang) {
          lang = lang.split("-")[0];
          lang =
            window.fast.info.languages.indexOf(lang) > -1
              ? lang
              : window.fast.info.languages[0];
          console.log("set lang to " + lang);
          window.fast.lang = lang;
          return new Promise((resolve, reject) => {
            resolve();
          });
        });
      }
      ytgame.system.onAudioEnabledChange(function (isAudioEnabled) {
        if (window.fast) window.fast.gameAudio = isAudioEnabled;
        if (typeof window.fastEnableAudio === "function")
          window.fastEnableAudio(isAudioEnabled);
      });
    </script>

    <div id="custom-cursor-dot"></div>
    <div id="custom-cursor-circle"></div>
    <script>
      (() => {
        if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          return;
        }

        const dot = document.getElementById("custom-cursor-dot");
        const circle = document.getElementById("custom-cursor-circle");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let circleX = mouseX;
        let circleY = mouseY;

        document.addEventListener("mousemove", (event) => {
          mouseX = event.clientX;
          mouseY = event.clientY;
          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        document.addEventListener("mousedown", () => {
          circle.classList.add("clicked");
        });

        document.addEventListener("mouseup", () => {
          circle.classList.remove("clicked");
        });

        function animateCursor() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;
          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";
          requestAnimationFrame(animateCursor);
        }

        animateCursor();
      })();
    </script>

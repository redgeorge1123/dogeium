
<!DOCTYPE html>
<html>
  <head>
    <base
      href="https://raw.githubusercontent.com/freebuisness/html/main/58-fix2.html"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .webgl-content,
      #gameContainer {
        width: 100vw;
        height: 100vh;
      }

      canvas {
        max-width: 100%;
        max-height: 100%;
      }

      /* Custom yellow cursor */
      * {
        cursor: none !important;
      }

      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition:
          width 0.15s ease,
          height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }
    </style>
  </head>

  <body dir="ltr">
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.js"></script>

    <script type="text/javascript">
      var gameInstance;
      window.onload = function () {
        gameInstance = UnityLoader.instantiate(
          "gameContainer",
          "https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.json",
          {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function () {
                UnityProgress(gameInstance, "complete");
              },
            },
          },
        );
      };
    </script>

    <div class="webgl-content">
      <div
        id="gameContainer"
        style="
          width: 100%;
          height: 100%;
          margin: 0px;
          padding: 0px;
          border: 0px;
          position: relative;
          background: rgb(0, 0, 0);
        "
      >
        <canvas
          id="#canvas"
          style="width: 100%; height: 100%; cursor: default"
          width="1018"
          height="926"
        ></canvas>
        <div class="logo Dark" style="display: none"></div>
        <div class="progress Dark" style="display: none">
          <div class="empty" style="width: 0%"></div>
          <div class="full" style="width: 100%"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-app.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1login.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firestore.js"></script>

    <script>
      initializeFireBase();

      function showAds() {
        console.log("show ads");
      }

      function requestNewAd() {
        unityAdFinishedCallback();
      }

      function unityAdFinishedCallback() {
        try {
          if (gameInstance)
            gameInstance.SendMessage("AdsManager", "OnWebCallback");
        } catch (error) {
          console.log(error);
        }
      }
    </script>

    <!-- Custom cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

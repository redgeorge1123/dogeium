    <script src="./jquery-2.1.1.min.js"></script>

    <script src="./coffee-helper.js"></script>
    <script src="./coffee.js"></script>
    <script>
      window.tool = {};
      window.tool.debugEnabled = true;
      window.tool.tasMode = true;
      window.tool.onSound = function (sound) {
        window.autosplitter.onSound(sound);
      };
      window.tool.onScene = function (name) {
        window.autosplitter.onScene(name);
        window.coffee.onScene(name);
      };
      window.tool.onUpdate = function (time) {
        window.autosplitter.onUpdate(time);
      };
    </script>

    <script src="./c2runtime.js"></script>

    <script src="./c2webappstart.js"></script>

    <!-- Custom cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

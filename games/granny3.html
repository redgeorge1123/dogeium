
<!DOCTYPE html>
<html lang="en-us">
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #231F20;
}

#unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
}

* {
    cursor: none !important;
}

#custom-cursor {
    position: fixed;
    width: 9px;
    height: 9px;
    background: #ffeb00;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483647;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
}

#cursor-circle {
    position: fixed;
    width: 35px;
    height: 35px;
    border: 2px solid #ffeb00;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483646;
    transform: translate(-50%, -50%);
    transition: width 0.15s ease, height 0.15s ease;
    box-shadow: 0 0 10px #ffeb00;
}
</style>
</head>

<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<script src="https://cdn.jsdelivr.net/gh/larpinguser/granny3-webport@main/FinalBuild/Build/FinalBuild.loader.js"></script>

<script>
(async function() {
    const baseUrl = "https://cdn.jsdelivr.net/gh/larpinguser/granny3-webport@main/FinalBuild/Build/";

    async function fetchAndMerge(filename, count, pad) {
        const parts = [];

        for (let i = 1; i <= count; i++) {
            const index = pad ? i.toString().padStart(2, '0') : i;
            const response = await fetch(`${baseUrl}${filename}.part${index}`);

            if (!response.ok) {
                throw new Error("Failed to fetch part " + index);
            }

            parts.push(await response.arrayBuffer());
        }

        const blob = new Blob(parts, {
            type: "application/octet-stream"
        });

        return URL.createObjectURL(blob);
    }

    try {
        const [wasmUrl, dataUrl] = await Promise.all([
            fetchAndMerge("FinalBuild.wasm", 2, false),
            fetchAndMerge("FinalBuild.data", 20, true)
        ]);

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

            document.getElementsByTagName('head')[0].appendChild(meta);

            var canvas = document.querySelector("#unity-canvas");
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";

            document.body.style.textAlign = "left";
        }

        createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: dataUrl,
            frameworkUrl: baseUrl + "FinalBuild.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: baseUrl + "../StreamingAssets",
            companyName: "DVloper",
            productName: "Granny 3",
            productVersion: "1.2",
        });

    } catch (e) {
        console.error(e);
    }
})();
</script>

<div id="cursor-circle"></div>
<div id="custom-cursor"></div>

<script>
(function () {
    const dot = document.getElementById("custom-cursor");
    const circle = document.getElementById("cursor-circle");

    let mouseX = -100;
    let mouseY = -100;
    let circleX = -100;
    let circleY = -100;

    document.addEventListener("mousemove", function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        dot.style.left = mouseX + "px";
        dot.style.top = mouseY + "px";
    });

    function animate() {
        circleX += (mouseX - circleX) * 0.12;
        circleY += (mouseY - circleY) * 0.12;

        circle.style.left = circleX + "px";
        circle.style.top = circleY + "px";

        requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener("mousedown", function () {
        circle.style.width = "27px";
        circle.style.height = "27px";
    });

    document.addEventListener("mouseup", function () {
        circle.style.width = "35px";
        circle.style.height = "35px";
    });

    document.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
        circle.style.opacity = "0";
    });

    document.addEventListener("mouseenter", function () {
        dot.style.opacity = "1";
        circle.style.opacity = "1";
    });
})();
</script>

</body>
</html>

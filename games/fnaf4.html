<!DOCTYPE html>
<html lang="en">

<head>
    <base href="https://cdn.jsdelivr.net/gh/blazerida/fnaf@latest/4/">
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <style>
        * {
            cursor: none !important;
        }

        #custom-cursor {
            position: fixed;
            width: 9px;
            height: 9px;
            background: #ffeb00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2147483647;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
        }

        #cursor-circle {
            position: fixed;
            width: 35px;
            height: 35px;
            border: 2px solid #ffeb00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2147483646;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease;
            box-shadow: 0 0 10px #ffeb00;
        }
    </style>
</head>

<body>
    <div style="display: inline-block; -webkit-user-select: none; text-align: left">
        <canvas id="MMFCanvas" width="1280" height="720">
            Your browser does not support Canvas, Please try again.
        </canvas>
    </div>

    <div id="progress-container">
        <div style="margin-bottom: 6px;">Downloading... <span id="download-text">0%</span></div>
        <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden;">
            <div id="download-bar" style="height: 10px; background: #3b82f6; width: 0%; transition: width 0.2s;"></div>
        </div>
        <div style="margin: 12px 0 6px;">Extracting... <span id="extract-text">0%</span></div>
        <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden;">
            <div id="extract-bar" style="height: 10px; background: #10b981; width: 0%; transition: width 0.2s;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="main.js"></script>

    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
        (function () {
            const dot = document.getElementById("custom-cursor");
            const circle = document.getElementById("cursor-circle");

            let mouseX = -100;
            let mouseY = -100;
            let circleX = -100;
            let circleY = -100;

            document.addEventListener("mousemove", function (e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                dot.style.left = mouseX + "px";
                dot.style.top = mouseY + "px";
            });

            function animate() {
                circleX += (mouseX - circleX) * 0.12;
                circleY += (mouseY - circleY) * 0.12;
                circle.style.left = circleX + "px";
                circle.style.top = circleY + "px";
                requestAnimationFrame(animate);
            }

            animate();

            document.addEventListener("mousedown", function () {
                circle.style.width = "27px";
                circle.style.height = "27px";
            });

            document.addEventListener("mouseup", function () {
                circle.style.width = "35px";
                circle.style.height = "35px";
            });

            document.addEventListener("mouseleave", function () {
                dot.style.opacity = "0";
                circle.style.opacity = "0";
            });

            document.addEventListener("mouseenter", function () {
                dot.style.opacity = "1";
                circle.style.opacity = "1";
            });
        })();
    </script>
</body>

</html>

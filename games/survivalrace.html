
<!doctype html>
<html>
<head>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
}

#loading {
    position: fixed;
    top: 50%;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font: 18px Arial;
}

/* Custom cursor */
* {
    cursor: none !important;
}

#custom-cursor {
    position: fixed;
    width: 9px;
    height: 9px;
    background: #ffeb00;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483647;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
}

#cursor-circle {
    position: fixed;
    width: 35px;
    height: 35px;
    border: 2px solid #ffeb00;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483646;
    transform: translate(-50%, -50%);
    transition: width 0.15s ease, height 0.15s ease;
    box-shadow: 0 0 10px #ffeb00;
}
</style>
</head>
<body>

<canvas id="unity-canvas"></canvas>
<div id="loading">Loading</div>

<script src="https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@8d767525fe856bc189118f6463f4b2d024de64fd/network/min.js"></script>

<script>
var ysdk = {
    features: {
        LoadingAPI: {
            ready: function() {}
        }
    }
};

var myGameInstance = null;

var playerData = JSON.stringify({
    playerAuth: 'rejected',
    playerName: 'unauthorized',
    playerId: 'unauthorized',
    playerPhoto: 'null'
});

var environmentData = JSON.stringify({
    language: 'en'
});

var cloudSaves = localStorage.getItem('survival-race-save') || 'noData';

try {
    var storedSaves = JSON.parse(cloudSaves);
    if (!Array.isArray(storedSaves)) {
        cloudSaves = JSON.stringify([cloudSaves]);
    }
} catch(error) {
    cloudSaves = 'noData';
}

function sendGame(method, value) {
    if (myGameInstance) {
        myGameInstance.SendMessage('YandexGame', method, value || '');
    } else {
        setTimeout(function() {
            sendGame(method, value);
        }, 100);
    }
}

function InitGame() {
    sendGame('SetInitializationSDK', playerData);
}

function InitPlayer() { InitGame(); }
function InitSDK() { InitGame(); }
function GameReadyAPI() {}
function LanguageRequest() { sendGame('SetLanguage', 'en'); }
function RequestingEnvironmentData() { sendGame('SetEnvironmentData', environmentData); }

function SaveCloud(data) {
    cloudSaves = JSON.stringify([data]);
    localStorage.setItem('survival-race-save', cloudSaves);
}

function LoadCloud() { sendGame('SetLoadSaves', cloudSaves); }
function FullAdShow() { sendGame('CloseFullAd', 'false'); }
function RewardedShow() { sendGame('CloseVideo'); }
function StickyAdActivity() {}
function StaticRBTDeactivate() {}
function InitLeaderboard() {}
function SetLeaderboardScores() {}
function GetLeaderboardScores() {}
function Review() { sendGame('ReviewSent', 'false'); }
function PromptShow() { sendGame('OnPromptFail'); }
function InitPayments() {}
function GetPayments() {}
function BuyPayments() {}
function ConsumePurchase() {}
function ConsumePurchases() {}
function OpenAuthDialog() { InitGame(); }
function PaintRBT() {}

createUnityInstance(
    document.getElementById("unity-canvas"),
    {
        dataUrl: "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@8d767525fe856bc189118f6463f4b2d024de64fd/network/cardata.js",
        frameworkUrl: "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@8d767525fe856bc189118f6463f4b2d024de64fd/network/carframework.js",
        codeUrl: "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@8d767525fe856bc189118f6463f4b2d024de64fd/network/carwasm.js",
        streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@8d767525fe856bc189118f6463f4b2d024de64fd/network/StreamingAssets",
        companyName: "Survival Race",
        productName: "Survival Race",
        productVersion: "1.0"
    },
    function(progress) {
        document.getElementById("loading").textContent =
            "Loading " + Math.round(progress * 100) + "%";
    }
).then(function(instance) {
    window.gameInstance = instance;
    myGameInstance = instance;
    myGameInstance = instance;
    document.getElementById("loading").remove();
}).catch(function(error) {
    document.getElementById("loading").textContent = String(error);
});
</script>

<!-- Custom cursor elements -->
<div id="cursor-circle"></div>
<div id="custom-cursor"></div>

<script>
(function() {
    const dot = document.getElementById("custom-cursor");
    const circle = document.getElementById("cursor-circle");

    let mouseX = -100;
    let mouseY = -100;
    let circleX = -100;
    let circleY = -100;

    document.addEventListener("mousemove", function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        dot.style.left = mouseX + "px";
        dot.style.top = mouseY + "px";
    });

    function animate() {
        circleX += (mouseX - circleX) * 0.12;
        circleY += (mouseY - circleY) * 0.12;

        circle.style.left = circleX + "px";
        circle.style.top = circleY + "px";

        requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener("mousedown", function() {
        circle.style.width = "27px";
        circle.style.height = "27px";
    });

    document.addEventListener("mouseup", function() {
        circle.style.width = "35px";
        circle.style.height = "35px";
    });

    document.addEventListener("mouseleave", function() {
        dot.style.opacity = "0";
        circle.style.opacity = "0";
    });

    document.addEventListener("mouseenter", function() {
        dot.style.opacity = "1";
        circle.style.opacity = "1";
    });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/death-run-3d/">

    <style>
        * {
            cursor: none !important;
        }

        #custom-cursor {
            position: fixed;
            width: 9px;
            height: 9px;
            background: #ffeb00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2147483647;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
        }

        #cursor-circle {
            position: fixed;
            width: 35px;
            height: 35px;
            border: 2px solid #ffeb00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2147483646;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease;
            box-shadow: 0 0 10px #ffeb00;
        }
    </style>

    <script>
        if (window.parent !== window.self) window.parent.postMessage("bonk", "*");

        window.addEventListener("DOMContentLoaded", function () {
            document.body.style.margin = "0";
            document.body.style.height = "100vh";
            document.body.style.overflow = "hidden";
        });
    </script>

    <link href="shared/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="TemplateData56/style.css" />
    <script src="TemplateData56/UnityProgress.js"></script>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <script src="Build/UnityLoader.js"></script>

    <script>
        window.rWS = WebSocket;

        WebSocket = function (url, options) {
            var split = url.split("://");
            var prefix = "";

            switch (split[0].toLowerCase()) {
                case "ws":
                    prefix = "wss://onebigorange-tmm.tbt.mx/websocket/http://";
                    break;
                case "wss":
                    prefix = "wss://onebigorange-tmm.tbt.mx/websocket/https://";
                    break;
                default:
                    prefix = split[0];
            }

            return new (Function.prototype.bind.call(
                window.rWS,
                null,
                (split[1].match(/\//g) || []).length === 0
                    ? (split[1].includes("?")
                        ? prefix + split[1].replace("?", "/?")
                        : prefix + split[1] + "/")
                    : prefix + split[1],
                options
            ))();
        };

        var origOpen = XMLHttpRequest.prototype.open;

        XMLHttpRequest.prototype.open = function (...args) {
            args[1] = /^http/.test(args[1])
                ? "https://onebigstatic-tmm.tbt.mx/static/" + args[1]
                : args[1];

            origOpen.apply(this, args);
        };

        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "Build/death_run_wasm_v1.json",
            {
                onProgress: UnityProgress,
                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(gameInstance, "complete");
                    },
                },
            }
        );
    </script>

    <script src="shared/lib.js" type="text/javascript"></script>
    <script src="shared/gamebreak/gamebreak.js" type="text/javascript"></script>
</head>

<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100vw; height: 100vh;"></div>
    </div>

    <!-- Custom cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
    (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
            mouseX = e.clientX;
            mouseY = e.clientY;

            dot.style.left = mouseX + "px";
            dot.style.top = mouseY + "px";
        });

        function animate() {
            circleX += (mouseX - circleX) * 0.12;
            circleY += (mouseY - circleY) * 0.12;

            circle.style.left = circleX + "px";
            circle.style.top = circleY + "px";

            requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
            circle.style.width = "27px";
            circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
            circle.style.width = "35px";
            circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
            dot.style.opacity = "0";
            circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
            dot.style.opacity = "1";
            circle.style.opacity = "1";
        });
    })();
    </script>
</body>
</html>

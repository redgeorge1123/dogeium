    <!-- Custom yellow cursor -->
    <style>
      * {
        cursor: none !important;
      }

      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition: width 0.15s ease, height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }

      @media (hover: none) {
        #custom-cursor,
        #cursor-circle {
          display: none;
        }

        * {
          cursor: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/234sd4w5w45wers5tr-645758574456456/435345345346@main/js/window.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/234sd4w5w45wers5tr-645758574456456/435345345346@main/js/loader.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/234sd4w5w45wers5tr-645758574456456/435345345346@main/js/app-new-gm.js"
    ></script>
    <div id="game">
      <canvas class="fadein" id="view" width="922" height="888"></canvas>
      <div id="ui_overlay"></div>
      <div id="ui" class="">
        <div id="left_side"></div>
        <div class="uibox">
          <div class="logo">
            <img
              src="https://cdn.jsdelivr.net/gh/234sd4w5w45wers5tr-645758574456456/435345345346@main/images/logo.png"
            />
          </div>
          <div class="tips">
            <div class="tip">
              Bite enemy tails but don't let them bite yours!
            </div>
          </div>
          <form class="play">
            <input
              type="text"
              id="nick"
              name="nick"
              autocomplete="off"
              placeholder="Your name"
              maxlength="12"
            />
            <button id="play" name="play" class="yellow">PLAY</button>
          </form>
        </div>
      </div>
      <div id="footer">
        <ul id="lng">
          <li class="active">EN</li>
          <li class="">RU</li>
          <li class="">TR</li>
          <li class="">SP</li>
          <li class="">FR</li>
          <li class="">NL</li>
          <li class="">PT</li>
          <li class="">DE</li>
          <li class="">IT</li>
        </ul>
      </div>
      <div id="overlay"></div>
    </div>
    <div
      id="imaContainer"
      style="
        position: absolute;
        z-index: 10000;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        visibility: hidden;
        overflow: hidden;
      "
    >
      <video id="imaVideo"></video>
    </div>

    <!-- Custom cursor elements -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/granny@main/">

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }

    * {
      cursor: none !important;
    }

    #custom-cursor {
      position: fixed;
      width: 9px;
      height: 9px;
      background: #ffeb00;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2147483647;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
    }

    #cursor-circle {
      position: fixed;
      width: 35px;
      height: 35px;
      border: 2px solid #ffeb00;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2147483646;
      transform: translate(-50%, -50%);
      transition: width 0.15s ease, height 0.15s ease;
      box-shadow: 0 0 10px #ffeb00;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
    }

    #loading-text {
      font-weight: bold;
      background: linear-gradient(
        270deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #0000ff,
        #4b0082,
        #8f00ff
      );
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 3s ease infinite;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>

  <div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">
    LOADING...
  </div>

  <script>
    var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;

      while (true) {
        const {
          done,
          value
        } = await reader.read();

        if (done) break;

        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);

        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '567.86';

        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }

      let fullBuffer = new Uint8Array(received);
      let offset = 0;

      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }

      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );

      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];

      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }

      return parts;
    }

    (async () => {
      const [dataUrl] = await Promise.all([
        mergeFiles(
          getParts("Build/GrannyPortButBetter.data.unityweb", 1, 29),
          "GrannyPortButBetter.data.unityweb"
        )
      ]);

      const originalOpen = XMLHttpRequest.prototype.open;

      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        if (url.includes("GrannyPortButBetter.data.unityweb")) {
          url = dataUrl;
        }

        return originalOpen.call(this, method, url, ...rest);
      };

      var unityInstance = UnityLoader.instantiate(
        "unityContainer",
        "Build/GrannyPortButBetter.json",
        { onProgress: UnityProgress }
      );

      loadingText.remove();
    })();
  </script>
</head>

<body>

  <div id="unityContainer"></div>

  <div id="cursor-circle"></div>
  <div id="custom-cursor"></div>

  <script>
    (function () {
      const dot = document.getElementById("custom-cursor");
      const circle = document.getElementById("cursor-circle");

      let mouseX = -100;
      let mouseY = -100;
      let circleX = -100;
      let circleY = -100;

      document.addEventListener("mousemove", function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        dot.style.left = mouseX + "px";
        dot.style.top = mouseY + "px";
      });

      function animate() {
        circleX += (mouseX - circleX) * 0.12;
        circleY += (mouseY - circleY) * 0.12;

        circle.style.left = circleX + "px";
        circle.style.top = circleY + "px";

        requestAnimationFrame(animate);
      }

      animate();

      document.addEventListener("mousedown", function () {
        circle.style.width = "27px";
        circle.style.height = "27px";
      });

      document.addEventListener("mouseup", function () {
        circle.style.width = "35px";
        circle.style.height = "35px";
      });

      document.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
        circle.style.opacity = "0";
      });

      document.addEventListener("mouseenter", function () {
        dot.style.opacity = "1";
        circle.style.opacity = "1";
      });
    })();
  </script>

</body>
</html>

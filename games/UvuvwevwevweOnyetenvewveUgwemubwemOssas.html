
<html lang="en-us">
  <head>
    <base
      href="https://cdn.jsdelivr.net/gh/bubbls/ports@main/UvuvwevwevweOnyetenvewveUgwemubwemOssas/"
    />
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <style>
      * {
        cursor: none !important;
      }

      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition:
          width 0.15s ease,
          height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">UvuvwevwevweOnyetenvewv</div>
      </div>
    </div>

    <script src="merge-parts.js"></script>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/fatty.loader.js";
      var config = {
        dataUrl: buildUrl + "/fatty.data",
        frameworkUrl: buildUrl + "/fatty.framework.js",
        codeUrl: buildUrl + "/fatty.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Zakaria",
        productName: "UvuvwevwevweOnyetenvewv",
        productVersion: "1.0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner("WebGL builds are not supported on mobile devices.");
      } else {
        canvas.style.width = "100vw";
        canvas.style.height = "105vh";
      }

      loadingBar.style.display = "block";
      var _blobUrls = null;

      (async () => {
        try {
          _blobUrls = await patchUnityConfigWithMergedParts(
            config,
            buildUrl,
            (overallProgress) => {
              progressBarFull.style.width = overallProgress * 50 + "%";
            },
          );
        } catch (err) {
          unityShowBanner("Failed to load game files: " + err.message, "error");
          console.error("[merge-parts] Error:", err);
          return;
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 50 + progress * 50 + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
              if (_blobUrls) {
                URL.revokeObjectURL(_blobUrls.dataBlob);
                URL.revokeObjectURL(_blobUrls.wasmBlob);
                console.log("[merge-parts] Blob URLs revoked – memory freed.");
              }
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      })();
    </script>

    <!-- Custom cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;
          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";
          requestAnimationFrame(animate);
        }
        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>

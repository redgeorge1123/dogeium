    <script>
      window.jkdfgnjkndfg = document.querySelector("base").href;

      fetch("simulation_worker.bundle.js")
        .then((res) => res.text())
        .then((text) => {
          const blob = new Blob(
            [text.replaceAll("replacethisplease", window.jkdfgnjkndfg)],
            {
              type: "application/javascript",
            },
          );
          window.simulationworker = URL.createObjectURL(blob);
        });

      const ogworker = window.Worker;

      window.Worker = function (scriptUrl, options) {
        if (
          typeof scriptUrl === "string" &&
          scriptUrl.toLowerCase() === "simulation_worker.bundle.js"
        ) {
          const wrapper = {};
          const actualWorker = new ogworker(window.simulationworker, options);
          Object.assign(wrapper, actualWorker);

          if (typeof wrapper.onmessage === "function") {
            actualWorker.onmessage = wrapper.onmessage;
          }

          return actualWorker;

          return new Proxy(wrapper, {
            get(target, prop) {
              return (...args) => {
                promise.then((realWorker) => realWorker[prop](...args));
              };
            },
            set(target, prop, value) {
              promise.then((realWorker) => {
                realWorker[prop] = value;
              });
              return true;
            },
          });
        }

        return new ogworker(scriptUrl, options);
      };

      window.Worker.prototype = ogworker.prototype;

      const ogfetch = window.fetch;

      window.fetch = async function (input, init) {
        if (typeof input === "string") {
          input = input.replace(
            "vps.kodub.com",
            "vpskodub.tmena1565.workers.dev",
          );
        } else if (input instanceof Request) {
          const newUrl = input.url.replace(
            "vps.kodub.com",
            "vpskodub.tmena1565.workers.dev",
          );
          input = new Request(newUrl, input);
        }

        return ogfetch(input, init);
      };

      const ogxml = XMLHttpRequest.prototype.open;

      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        if (typeof url === "string") {
          url = url.replace(

  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <!-- Custom Cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>

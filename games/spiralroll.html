    <style>
      * {
        padding: 0;
        margin: 0;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        cursor: none !important;
      }

      body,
      html {
        position: absolute;
        margin: 0;
        padding: 0;
        top: 0;
        right: 0;
        left: 0;
        bottom: 0;
        overflow: hidden;
        background: 0 0;
        touch-action: none;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
      }

      #custom-cursor {
        position: fixed;
        width: 9px;
        height: 9px;
        background: #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483647;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px #ffeb00, 0 0 20px #ffeb00;
      }

      #cursor-circle {
        position: fixed;
        width: 35px;
        height: 35px;
        border: 2px solid #ffeb00;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2147483646;
        transform: translate(-50%, -50%);
        transition: width 0.15s ease, height 0.15s ease;
        box-shadow: 0 0 10px #ffeb00;
      }

  <body>
    <script src="https://cdn.jsdelivr.net/gh/my-files-schoolum/spi@main/gamesnacks.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/my-files-schoolum/spi@main/lib/VOODOO-H5SDK.snacks.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/my-files-schoolum/spi@main/main.js"
    ></script>

    <!-- Custom cursor -->
    <div id="cursor-circle"></div>
    <div id="custom-cursor"></div>

    <script>
      (function () {
        const dot = document.getElementById("custom-cursor");
        const circle = document.getElementById("cursor-circle");

        let mouseX = -100;
        let mouseY = -100;
        let circleX = -100;
        let circleY = -100;

        document.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;

          dot.style.left = mouseX + "px";
          dot.style.top = mouseY + "px";
        });

        function animate() {
          circleX += (mouseX - circleX) * 0.12;
          circleY += (mouseY - circleY) * 0.12;

          circle.style.left = circleX + "px";
          circle.style.top = circleY + "px";

          requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener("mousedown", function () {
          circle.style.width = "27px";
          circle.style.height = "27px";
        });

        document.addEventListener("mouseup", function () {
          circle.style.width = "35px";
          circle.style.height = "35px";
        });

        document.addEventListener("mouseleave", function () {
          dot.style.opacity = "0";
          circle.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function () {
          dot.style.opacity = "1";
          circle.style.opacity = "1";
        });
      })();
    </script>
  </body>
</html>
